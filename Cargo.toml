[package]
name = "fuse-binwalk"
version = "0.1.0"
edition = "2021"
authors = ["Vega Carlson <vegac@protonmail.com>"]
description = "Mount arbitrary binaries and firmware images as navigable, writable FUSE filesystems using Binwalk v3"
license = "MIT OR Apache-2.0"
repository = "https://github.com/triode-the-andrewsarchus/fuse-binwalk"
homepage = "https://github.com/triode-the-andrewsarchus/fuse-binwalk"
readme = "README.md"
keywords = ["fuse", "binwalk", "firmware", "reverse-engineering", "filesystem"]
categories = ["command-line-utilities", "filesystem", "parsing"]

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
binwalk = "3.1.0"
bzip2 = "0.4"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.5"
ctrlc = "3.4"
daemonize = "0.5"
env_logger = "0.11"
filetime = "0.2"
flate2 = "1.0"
fuser = { version = "0.14", default-features = false }
libc = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tempfile = "3.10"
thiserror = "1.0"
walkdir = "2.5"
xz2 = "0.1"
font-kit = { version = "0.14", features = ["source-fontconfig-dlopen"] }

[profile.dev]
opt-level = 2

