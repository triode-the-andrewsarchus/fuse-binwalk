[package]
name = "fuse-binwalk"
version = "0.1.0"
edition = "2021"
description = "FUSE filesystem driver powered by Binwalk v3 for mounting arbitrary binaries"

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
binwalk = "3.1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
daemonize = "0.5"
env_logger = "0.11"
fuser = { version = "0.14", default-features = false }
libc = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "1.0"
font-kit = { version = "0.14", features = ["source-fontconfig-dlopen"] }

[dev-dependencies]
flate2 = "1.0"
tar = "0.4"

[profile.dev]
opt-level = 2

